<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>YAMP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chassis">
    <header class="titlebar">
      <span class="bolt">ϟ</span><span class="grooves"></span><h1>YAMP <span>· YOUTUBE MUSIC</span></h1><span class="grooves"></span>
      <button data-action="pin" id="pin" title="Siempre encima" aria-label="Siempre encima">◆</button>
      <button data-action="minimize" title="Minimizar" aria-label="Minimizar">_</button>
      <button data-action="close" title="Salir" aria-label="Salir">×</button>
    </header>
    <section class="deck" aria-label="Reproductor">
      <div class="screen">
        <div class="readout"><span id="indicator">■</span><span id="time">00:00</span><span class="format">WEB<br>STEREO</span></div>
        <div class="track"><div id="title">YAMP · TU MÚSICA, A TU MANERA</div><div id="artist">Busca una canción o abre tu biblioteca</div></div>
        <div class="screen-footer"><span id="status">CONECTANDO</span><span id="duration">--:--</span><span>YT / DIGITAL AUDIO</span></div>
      </div>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posición de reproducción" disabled>
      <div class="mixer"><button data-action="mute" id="mute" title="Silenciar">VOL</button><input id="volume" type="range" min="0" max="100" value="75" aria-label="Volumen"><span id="volume-value">75%</span><button data-action="shuffle" id="shuffle" title="Aleatorio">SHUF</button><button data-action="repeat" id="repeat" title="Repetición: desactivada / toda la cola / una canción">REP</button><button data-action="like" title="Guardar Me gusta en tu cuenta">♥</button></div>
      <div class="transport">
        <div class="transport-buttons"><button data-action="previous" title="Anterior" aria-label="Anterior">|◀</button><button data-action="toggle" id="play" title="Reproducir / pausar (espacio)" aria-label="Reproducir / pausar">▶</button><button data-action="pause" title="Pausar" aria-label="Pausar">Ⅱ</button><button data-action="stop" title="Detener" aria-label="Detener">■</button><button data-action="next" title="Siguiente" aria-label="Siguiente">▶|</button></div>
        <button data-action="music" class="music-button">MUSIC</button><button id="toggle-queue" title="Mostrar / ocultar catálogo" aria-expanded="true">PL</button>
      </div>
      <div class="message" id="message" role="status">Conectando con YouTube Music…</div>
    </section>
    <section class="playlist" id="playlist" aria-label="Cola de reproducción">
      <div class="section-title"><span class="grooves"></span><h2 id="list-title">CATÁLOGO</h2><span class="grooves"></span><span id="count">00</span></div>
      <form id="search-form"><input id="search" type="search" placeholder="Buscar en YouTube Music…" aria-label="Buscar música" maxlength="300" required><button type="submit" title="Buscar">⌕</button></form>
      <nav class="catalogue-nav"><button data-action="show-queue">COLA</button><button data-action="home">INICIO</button><button data-action="library">BIBLIOTECA</button><select id="filter" aria-label="Filtrar biblioteca" hidden></select><button data-action="more" id="more" hidden title="Cargar más resultados">MÁS</button></nav>
      <ol id="queue"></ol>
      <div id="empty">TU PRÓXIMA OBSESIÓN EMPIEZA AQUÍ.<br><span>Busca música o abre tu biblioteca.</span></div>
      <footer><button data-action="login" title="Chrome se usa únicamente para iniciar sesión">CUENTA ↗</button><button data-action="save-session" id="save-session" hidden title="Guardar la sesión y cerrar Chrome">GUARDAR SESIÓN</button><span>AUDIO NATIVO <b>0.2</b></span></footer>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
